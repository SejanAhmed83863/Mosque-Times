<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – Mosque Prayer Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --gold:#D4AF37; --green:#1B5E20; --teal:#004D40;
            --red:#C62828;  --shadow:rgba(0,0,0,0.25);
        }
        body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,var(--teal),var(--green));min-height:100vh;padding:30px 20px}

        /* ── LOGIN ── */
        .login-wrap{max-width:440px;margin:80px auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px var(--shadow)}
        .login-wrap h1{font-family:'Amiri',serif;font-size:2.4rem;color:var(--green);text-align:center;margin-bottom:6px}
        .login-wrap p{text-align:center;color:#777;margin-bottom:28px}
        .err{color:var(--red);font-size:.9rem;margin-top:6px;display:none}
        .err.on{display:block}

        /* ── PANEL ── */
        .panel{max-width:1200px;margin:0 auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px var(--shadow);display:none}
        .panel.on{display:block}

        /* header bar */
        .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);padding-bottom:18px;margin-bottom:28px;flex-wrap:wrap;gap:12px}
        .ph h1{font-family:'Amiri',serif;font-size:2.4rem;color:var(--green)}

        /* tabs */
        .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;border-bottom:2px solid #eee}
        .tab{padding:11px 22px;background:none;border:none;border-bottom:3px solid transparent;font-size:1rem;font-weight:600;color:#777;cursor:pointer;transition:.25s;margin-bottom:-2px}
        .tab.on{color:var(--green);border-bottom-color:var(--gold)}

        .tc{display:none}.tc.on{display:block}

        /* form elements */
        .fg{margin-bottom:18px}
        .fg label{display:block;margin-bottom:7px;font-weight:600;color:#333}
        .fi{width:100%;padding:11px 14px;border:2px solid #ddd;border-radius:10px;font-size:1rem;font-family:'Tajawal',sans-serif;transition:.25s}
        .fi:focus{outline:none;border-color:var(--gold)}
        select.fi{cursor:pointer}

        /* buttons */
        .btn{padding:11px 22px;border:none;border-radius:9px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.25s}
        .btn:hover{transform:translateY(-2px)}
        .btn-green{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff}
        .btn-gold{background:linear-gradient(135deg,var(--gold),#b8972e);color:#222}
        .btn-red{background:var(--red);color:#fff}
        .btn-gray{background:#9E9E9E;color:#fff}
        .btn-sm{padding:7px 14px;font-size:.85rem}
        .btn-w{width:100%}

        /* add-form box */
        .add-box{display:none;background:#f8f8f8;border:2px solid var(--gold);border-radius:12px;padding:24px;margin:16px 0}
        .add-box.on{display:block}
        .add-box h3{color:var(--green);margin-bottom:16px}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media(max-width:600px){.row2{grid-template-columns:1fr}}

        /* success toast */
        .toast{padding:14px 18px;background:#388E3C;color:#fff;border-radius:9px;margin-bottom:22px;display:none;animation:fadeIn .3s}
        .toast.on{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

        /* mosque items */
        .mosque-item{background:#f5f5f5;border-left:5px solid var(--gold);border-radius:10px;padding:22px;margin-bottom:18px}
        .mi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .mi-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .mi-name{font-size:1.35rem;font-weight:700;color:var(--green)}
        .mi-name-input{font-size:1.1rem;padding:7px 11px;border:2px solid var(--gold);border-radius:8px;font-family:'Tajawal',sans-serif;display:none}
        .mi-name-input.on{display:inline-block}
        .mi-name.hidden{display:none}

        .time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
        .tg{display:flex;flex-direction:column}
        .tg label{font-size:.85rem;font-weight:600;color:#666;margin-bottom:5px}
        .tg-wrap{position:relative}
        /* hide browser time input so we show custom selects */
        .time-sel-wrap{display:flex;gap:5px;align-items:center}
        .time-sel{padding:8px 6px;border:2px solid #ddd;border-radius:7px;font-size:.95rem;font-family:'Tajawal',sans-serif;cursor:pointer;background:#fff;transition:.2s}
        .time-sel:focus{outline:none;border-color:var(--gold)}
        .ampm-sel{padding:8px 5px;border:2px solid #ddd;border-radius:7px;font-size:.9rem;cursor:pointer;background:#fff;transition:.2s}
        .ampm-sel:focus{outline:none;border-color:var(--gold)}

        /* sub-admin items */
        .sa-item{background:#f5f5f5;border-left:5px solid var(--gold);border-radius:10px;padding:18px 22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
        .sa-info strong{display:block;font-size:1.1rem;color:var(--green)}
        .sa-info span{font-size:.88rem;color:#666}

        /* notification buttons row */
        .notif-btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

        /* logout */
        .logout{padding:10px 22px;background:var(--red);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:.25s}
        .logout:hover{transform:scale(1.04)}

        /* checkboxes for mosque assignment */
        .mosque-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:6px}
        .check-label{display:flex;align-items:center;gap:7px;font-size:.95rem;cursor:pointer;padding:7px 10px;background:#fff;border:1px solid #ddd;border-radius:7px;transition:.2s}
        .check-label:hover{border-color:var(--gold)}
        .check-label input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}

        @media(max-width:600px){
            .ph{flex-direction:column;text-align:center}
            .mi-head{flex-direction:column;align-items:flex-start}
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
    <h1>Admin Panel</h1>
    <p>Mosque Prayer Times Management</p>
    <form onsubmit="doLogin(event)">
        <div class="fg"><label>Email</label><input class="fi" id="le" type="email" required></div>
        <div class="fg"><label>Password</label><input class="fi" id="lp" type="password" required></div>
        <div class="err" id="lerr">❌ Invalid email or password.</div>
        <button class="btn btn-green btn-w" style="margin-top:6px">Login</button>
    </form>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
    <div class="ph">
        <h1>⚙️ Admin Dashboard</h1>
        <button class="logout" onclick="doLogout()">Logout</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="tabs">
        <button class="tab on" onclick="openTab('mosques',this)">🕌 Mosques</button>
        <button class="tab"    onclick="openTab('subadmins',this)">👤 Sub-Admins</button>
        <button class="tab"    onclick="openTab('notif',this)">📢 Emergency Notice</button>
    </div>

    <!-- TAB: MOSQUES -->
    <div class="tc on" id="tc-mosques">
        <button class="btn btn-gold" onclick="toggleBox('addMosqueBox')">+ Add New Mosque</button>

        <div class="add-box" id="addMosqueBox">
            <h3>Add New Mosque</h3>
            <div class="fg"><label>Mosque Name</label><input class="fi" id="newMosqueName" placeholder="e.g. Al-Farooq Masjid"></div>
            <div style="display:flex;gap:10px;margin-top:4px">
                <button class="btn btn-gray" onclick="toggleBox('addMosqueBox')">Cancel</button>
                <button class="btn btn-green" onclick="addMosque()">Add Mosque</button>
            </div>
        </div>

        <div id="mosqueList" style="margin-top:20px"></div>
    </div>

    <!-- TAB: SUB-ADMINS -->
    <div class="tc" id="tc-subadmins">
        <button class="btn btn-gold" onclick="toggleBox('addSABox')">+ Add Sub-Admin</button>

        <div class="add-box" id="addSABox">
            <h3>Add New Sub-Admin</h3>
            <div class="row2">
                <div class="fg"><label>Email</label><input class="fi" id="saEmail" type="email" placeholder="subadmin@example.com"></div>
                <div class="fg"><label>Password</label><input class="fi" id="saPass" type="password" placeholder="Password"></div>
            </div>
            <div class="fg">
                <label>Assign Mosques (one or more)</label>
                <div class="mosque-checks" id="mosqueCheckList"></div>
            </div>
            <div style="display:flex;gap:10px;margin-top:4px">
                <button class="btn btn-gray" onclick="toggleBox('addSABox')">Cancel</button>
                <button class="btn btn-green" onclick="addSubadmin()">Add Sub-Admin</button>
            </div>
        </div>

        <div id="saList" style="margin-top:20px"></div>
    </div>

    <!-- TAB: NOTIFICATION -->
    <div class="tc" id="tc-notif">
        <div class="fg">
            <label>Emergency Notification Message</label>
            <textarea class="fi" id="notifMsg" rows="4" placeholder="Type your emergency message here…"></textarea>
        </div>
        <div class="notif-btns">
            <button class="btn btn-red" onclick="clearNotif()">Clear Notification</button>
            <button class="btn btn-green" onclick="saveNotif()">Publish Notification</button>
        </div>
    </div>
</div>

<script>
/* ──────── DATA ──────── */
const KEY = 'mosqueApp';

function load() {
    const s = localStorage.getItem(KEY);
    if (s) return JSON.parse(s);
    return {
        admin:    { email:'sejansasker@gmail.com', password:'Sejan&&0987' },
        subadmins:[],
        mosques:  [
            { id:1, name:'Central Masjid', times:{ fajr:'05:30', zuhr:'13:00', asr:'16:30', maghrib:'18:45', isha:'20:15' }},
            { id:2, name:'Al-Noor Masjid', times:{ fajr:'05:35', zuhr:'13:05', asr:'16:35', maghrib:'18:50', isha:'20:20' }}
        ],
        notification:''
    };
}
function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }

/* ──────── HELPERS ──────── */
const PRAYERS = ['fajr','zuhr','asr','maghrib','isha'];
const PLABELS  = { fajr:'Fajr', zuhr:'Zuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };

function to12(t24){
    if(!t24) return '--';
    const [hh,mm] = t24.split(':');
    let h = parseInt(hh);
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${mm} ${ap}`;
}
function to24(h, m, ap){
    let hour = parseInt(h);
    if(ap === 'PM' && hour !== 12) hour += 12;
    if(ap === 'AM' && hour === 12) hour = 0;
    return `${String(hour).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    setTimeout(()=> t.classList.remove('on'), 3000);
}

function toggleBox(id){
    const el = document.getElementById(id);
    el.classList.toggle('on');
    if(id === 'addSABox' && el.classList.contains('on')) renderMosqueChecks();
}

function openTab(name, btn){
    document.querySelectorAll('.tc').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.getElementById('tc-'+name).classList.add('on');
    btn.classList.add('on');
}

/* ──────── AUTH ──────── */
function doLogin(e){
    e.preventDefault();
    const d = load();
    if(document.getElementById('le').value === d.admin.email &&
       document.getElementById('lp').value === d.admin.password){
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('panel').classList.add('on');
        document.getElementById('lerr').classList.remove('on');
        document.getElementById('notifMsg').value = d.notification;
        renderMosques(); renderSAList();
    } else {
        document.getElementById('lerr').classList.add('on');
    }
}
function doLogout(){
    document.getElementById('loginWrap').style.display = '';
    document.getElementById('panel').classList.remove('on');
    document.getElementById('le').value = '';
    document.getElementById('lp').value = '';
}

/* ──────── TIME SELECTS ──────── */
function makeTimeSelects(mosqueId, prayer, val24){
    const [hh, mm] = val24 ? val24.split(':') : ['05','00'];
    let h12 = parseInt(hh) % 12 || 12;
    const ap = parseInt(hh) >= 12 ? 'PM' : 'AM';

    const hSel = buildSelect(Array.from({length:12},(_,i)=>i+1), h12,
        `H-${mosqueId}-${prayer}`, ()=> saveTime(mosqueId, prayer));
    const mSel = buildSelect(Array.from({length:60},(_,i)=>String(i).padStart(2,'0')),
        String(parseInt(mm)).padStart(2,'0') , `M-${mosqueId}-${prayer}`, ()=> saveTime(mosqueId, prayer), true);
    const apSel = buildAmPm(ap, `AP-${mosqueId}-${prayer}`, ()=> saveTime(mosqueId, prayer));

    return `<div class="time-sel-wrap">${hSel}:${mSel}${apSel}</div>`;
}

function buildSelect(options, selected, id, onchange, padded=false){
    const opts = options.map(o=>{
        const v = padded ? o : String(o).padStart(2,'0');
        const display = padded ? o : o;
        return `<option value="${v}" ${String(selected).padStart(2,'0')===v||String(selected)===String(o)?'selected':''}>${padded?o:String(o).padStart(2,'0')}</option>`;
    }).join('');
    return `<select class="time-sel" id="${id}" onchange="${onchange.toString().replace('()=>','').trim()}saveTime(${id.split('-')[1]}, '${id.split('-')[2]}')">${opts}</select>`;
}

function buildAmPm(selected, id, onchange){
    return `<select class="ampm-sel" id="${id}" onchange="saveTimeById('${id}')">
        <option ${selected==='AM'?'selected':''}>AM</option>
        <option ${selected==='PM'?'selected':''}>PM</option>
    </select>`;
}

function makeTimeSels(mosqueId, prayer, val24){
    const [hh, mm] = val24 ? val24.split(':') : ['05','00'];
    let h = parseInt(hh); const ap = h>=12?'PM':'AM'; h = h%12||12;
    const hOpts = Array.from({length:12},(_,i)=>i+1).map(n=>`<option ${n===h?'selected':''}>${n}</option>`).join('');
    const mOpts = Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(n=>`<option ${n===String(parseInt(mm)).padStart(2,'0')?'selected':''}>${n}</option>`).join('');
    const apOpts = ['AM','PM'].map(x=>`<option ${x===ap?'selected':''}>${x}</option>`).join('');
    const pid = `${mosqueId}_${prayer}`;
    return `<div class="time-sel-wrap">
        <select class="time-sel" id="H_${pid}" onchange="saveTime(${mosqueId},'${prayer}')">${hOpts}</select>
        :
        <select class="time-sel" id="M_${pid}" onchange="saveTime(${mosqueId},'${prayer}')">${mOpts}</select>
        <select class="ampm-sel" id="AP_${pid}" onchange="saveTime(${mosqueId},'${prayer}')">${apOpts}</select>
    </div>`;
}

function saveTime(mosqueId, prayer){
    const pid = `${mosqueId}_${prayer}`;
    const h  = document.getElementById(`H_${pid}`).value;
    const m  = document.getElementById(`M_${pid}`).value;
    const ap = document.getElementById(`AP_${pid}`).value;
    const d  = load();
    const mosque = d.mosques.find(x=>x.id===mosqueId);
    if(mosque){ mosque.times[prayer] = to24(h,m,ap); save(d); showToast(`✅ ${PLABELS[prayer]} time updated!`); }
}

/* ──────── MOSQUES ──────── */
function renderMosques(){
    const d = load();
    const el = document.getElementById('mosqueList');
    if(!d.mosques.length){ el.innerHTML='<p style="color:#999;padding:20px">No mosques added yet.</p>'; return; }
    el.innerHTML = d.mosques.map(m=> `
        <div class="mosque-item" id="mi_${m.id}">
            <div class="mi-head">
                <div class="mi-name-row">
                    <span class="mi-name" id="mn_${m.id}">${m.name}</span>
                    <input class="mi-name-input fi" id="mni_${m.id}" value="${m.name}" onkeydown="if(event.key==='Enter')saveMosqueName(${m.id})">
                    <button class="btn btn-gold btn-sm" id="editBtn_${m.id}" onclick="toggleEditName(${m.id})">✏️ Edit Name</button>
                    <button class="btn btn-green btn-sm" id="saveBtn_${m.id}" style="display:none" onclick="saveMosqueName(${m.id})">💾 Save</button>
                </div>
                <button class="btn btn-red btn-sm" onclick="deleteMosque(${m.id})">🗑 Delete</button>
            </div>
            <div class="time-grid">
                ${PRAYERS.map(p=>`
                    <div class="tg">
                        <label>${PLABELS[p]}</label>
                        ${makeTimeSels(m.id, p, m.times[p])}
                    </div>`).join('')}
            </div>
        </div>`).join('');
}

function toggleEditName(id){
    const nameEl  = document.getElementById(`mn_${id}`);
    const inputEl = document.getElementById(`mni_${id}`);
    const editBtn = document.getElementById(`editBtn_${id}`);
    const saveBtn = document.getElementById(`saveBtn_${id}`);
    const editing = inputEl.classList.contains('on');
    if(editing){
        nameEl.classList.remove('hidden'); inputEl.classList.remove('on');
        editBtn.style.display=''; saveBtn.style.display='none';
    } else {
        inputEl.value = nameEl.textContent;
        nameEl.classList.add('hidden'); inputEl.classList.add('on');
        editBtn.style.display='none'; saveBtn.style.display='';
        inputEl.focus();
    }
}

function saveMosqueName(id){
    const val = document.getElementById(`mni_${id}`).value.trim();
    if(!val){ alert('Mosque name cannot be empty.'); return; }
    const d = load();
    const m = d.mosques.find(x=>x.id===id);
    if(m){ m.name = val; save(d); renderMosques(); renderSAList(); showToast('✅ Mosque name updated!'); }
}

function addMosque(){
    const name = document.getElementById('newMosqueName').value.trim();
    if(!name){ alert('Please enter a mosque name.'); return; }
    const d = load();
    d.mosques.push({ id:Date.now(), name, times:{ fajr:'05:00', zuhr:'12:30', asr:'15:45', maghrib:'18:00', isha:'19:30' }});
    save(d); renderMosques(); renderSAList();
    document.getElementById('newMosqueName').value='';
    toggleBox('addMosqueBox');
    showToast('✅ Mosque added!');
}

function deleteMosque(id){
    if(!confirm('Delete this mosque?')) return;
    const d = load();
    d.mosques = d.mosques.filter(m=>m.id!==id);
    // remove mosque from sub-admins too
    d.subadmins.forEach(sa=>{ sa.mosques = (sa.mosques||[]).filter(mid=>mid!==id); });
    save(d); renderMosques(); renderSAList();
    showToast('🗑 Mosque deleted.');
}

/* ──────── SUB-ADMINS ──────── */
function renderMosqueChecks(){
    const d = load();
    const el = document.getElementById('mosqueCheckList');
    if(!d.mosques.length){ el.innerHTML='<p style="color:#999">Add mosques first.</p>'; return; }
    el.innerHTML = d.mosques.map(m=>`
        <label class="check-label">
            <input type="checkbox" value="${m.id}" id="chk_${m.id}"> ${m.name}
        </label>`).join('');
}

function addSubadmin(){
    const email = document.getElementById('saEmail').value.trim();
    const pass  = document.getElementById('saPass').value.trim();
    const d = load();
    const checked = [...document.querySelectorAll('#mosqueCheckList input:checked')].map(x=>parseInt(x.value));

    if(!email||!pass){ alert('Fill in email and password.'); return; }
    if(!checked.length){ alert('Assign at least one mosque.'); return; }
    if(d.subadmins.some(s=>s.email===email)){ alert('This email is already registered.'); return; }

    d.subadmins.push({ email, password:pass, mosques:checked });
    save(d); renderSAList();
    document.getElementById('saEmail').value='';
    document.getElementById('saPass').value='';
    toggleBox('addSABox');
    showToast('✅ Sub-admin added!');
}

function deleteSA(idx){
    if(!confirm('Delete this sub-admin?')) return;
    const d = load(); d.subadmins.splice(idx,1); save(d);
    renderSAList(); showToast('🗑 Sub-admin deleted.');
}

function renderSAList(){
    const d = load();
    const el = document.getElementById('saList');
    if(!d.subadmins.length){ el.innerHTML='<p style="color:#999;padding:16px">No sub-admins yet.</p>'; return; }
    el.innerHTML = d.subadmins.map((sa,i)=>{
        const names = (sa.mosques||[]).map(mid=>{ const m=d.mosques.find(x=>x.id===mid); return m?m.name:'?'; }).join(', ')||'None';
        return `<div class="sa-item">
            <div class="sa-info">
                <strong>${sa.email}</strong>
                <span>🕌 Assigned: ${names}</span>
            </div>
            <button class="btn btn-red btn-sm" onclick="deleteSA(${i})">Delete</button>
        </div>`;
    }).join('');
}

/* ──────── NOTIFICATION ──────── */
function saveNotif(){
    const d = load();
    d.notification = document.getElementById('notifMsg').value.trim();
    save(d); showToast('📢 Notification published!');
}
function clearNotif(){
    const d = load(); d.notification='';
    save(d); document.getElementById('notifMsg').value='';
    showToast('🗑 Notification cleared.');
}
</script>
</body>
</html>
