<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Prayer Times - جماعت کے اوقات</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37;
            --green: #1B5E20;
            --teal: #004D40;
            --cream: #FAF3E0;
            --red: #C62828;
            --shadow: rgba(0,0,0,0.3);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--teal) 0%, var(--green) 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            background-image:
                repeating-linear-gradient(60deg, transparent, transparent 40px, var(--gold) 40px, var(--gold) 41px),
                repeating-linear-gradient(-60deg, transparent, transparent 40px, var(--gold) 40px, var(--gold) 41px),
                repeating-linear-gradient(0deg, transparent, transparent 40px, var(--gold) 40px, var(--gold) 41px);
            pointer-events: none; z-index: 0;
        }
        .app { position: relative; z-index: 1; }

        .notif-bar {
            background: linear-gradient(90deg, var(--red), #B71C1C);
            color: #fff; padding: 14px 20px; text-align: center;
            font-size: 1rem; font-weight: 600;
            display: none; animation: slideDown 0.5s ease;
        }
        .notif-bar.on { display: block; }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .header {
            background: linear-gradient(135deg, rgba(0,77,64,0.97), rgba(27,94,32,0.97));
            padding: 35px 20px 30px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 6px 30px var(--shadow);
        }
        .header-arabic {
            font-family: 'Amiri', serif;
            font-size: 3.2rem; color: var(--gold);
            text-shadow: 1px 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 3px; margin-bottom: 8px;
        }
        .header-english {
            font-size: 1.4rem; color: var(--cream);
            font-weight: 300; opacity: 0.92;
        }
        .live-clock {
            margin-top: 14px;
            font-size: 1.15rem; color: #fff;
            font-weight: 500; opacity: 0.85;
        }

        .main { max-width: 1400px; margin: 45px auto; padding: 0 25px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px; margin-bottom: 50px;
        }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 22px; padding: 30px 28px;
            box-shadow: 0 12px 40px var(--shadow);
            position: relative; overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 18px 55px var(--shadow); }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--gold), var(--green), var(--gold));
        }
        .card-crescent {
            position: absolute; top: 16px; right: 18px;
            font-size: 3.5rem; color: var(--gold); opacity: 0.09;
        }
        .mosque-name {
            font-family: 'Amiri', serif;
            font-size: 1.75rem; color: var(--green);
            font-weight: 700; margin-bottom: 22px;
        }

        .prayer-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 14px;
            background: linear-gradient(90deg, rgba(27,94,32,0.06), transparent);
            border-left: 4px solid var(--gold);
            border-radius: 8px; margin-bottom: 10px;
            transition: all 0.25s;
        }
        .prayer-row:last-child { margin-bottom: 0; }
        .prayer-row:hover { background: linear-gradient(90deg, rgba(27,94,32,0.13), transparent); transform: translateX(4px); }
        .p-name { font-weight: 700; color: #222; font-size: 1.05rem; }
        .p-time { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--green); font-weight: 700; }

        footer { text-align: center; padding: 30px; color: rgba(255,255,255,0.7); font-size: 0.9rem; }
        .loading { text-align: center; padding: 40px; color: #fff; font-size: 1.2rem; }

        @media(max-width:600px){
            .header-arabic { font-size: 2.1rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="notif-bar" id="notifBar"></div>

    <header class="header">
        <div class="header-arabic">مسجد جماعت کے اوقات</div>
        <div class="header-english">Mosque Jamaat Prayer Times</div>
        <div class="live-clock" id="clock"></div>
    </header>

    <main class="main">
        <div class="grid" id="grid">
            <div class="loading">Loading prayer times...</div>
        </div>
    </main>

    <footer>May Allah accept our prayers &nbsp;•&nbsp; جزاک اللہ خیرا</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDa2rZvHFvQUVbxADMbm6Y3Luy0vTqOops",
  authDomain: "mosque-times-506dd.firebaseapp.com",
  projectId: "mosque-times-506dd",
  storageBucket: "mosque-times-506dd.firebasestorage.app",
  messagingSenderId: "851807138207",
  appId: "1:851807138207:web:1d2a103718debd15450daa",
  measurementId: "G-4MTXBD8NT5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRAYERS = ['fajr','zuhr','asr','maghrib','isha'];
const PRAYER_LABELS = { fajr:'Fajr', zuhr:'Zuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };

function to12(t24) {
    if (!t24) return '--:-- --';
    const [hStr, mStr] = t24.split(':');
    let h = parseInt(hStr), m = mStr;
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${ampm}`;
}

function render(mosques, notification) {
    const nb = document.getElementById('notifBar');
    if (notification) { 
        nb.textContent = notification; 
        nb.classList.add('on'); 
    } else { 
        nb.classList.remove('on'); 
    }
    
    const grid = document.getElementById('grid');
    if (!mosques || mosques.length === 0) {
        grid.innerHTML = '<div class="loading">No mosques found. Admin, please add mosques.</div>';
        return;
    }

    grid.innerHTML = mosques.map(m => `
        <div class="card">
            <div class="card-crescent">☪</div>
            <div class="mosque-name">${m.name}</div>
            ${PRAYERS.map(p => `
                <div class="prayer-row">
                    <span class="p-name">${PRAYER_LABELS[p]}</span>
                    <span class="p-time">${to12(m.times[p])}</span>
                </div>`).join('')}
        </div>`).join('');
}

function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
        now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) +
        '  •  ' +
        now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function init() {
    tickClock();
    setInterval(tickClock, 1000);

    db.collection('mosques').orderBy('id').onSnapshot(snapshot => {
        const mosques = [];
        snapshot.forEach(doc => {
            mosques.push(doc.data());
        });

        db.collection('notification').doc('current').onSnapshot(doc => {
            const notification = doc.exists ? (doc.data().message || '') : '';
            render(mosques, notification);
        });
    }, error => {
        console.log("Firestore error:", error);
        document.getElementById('grid').innerHTML = '<div class="loading">Error loading data. Check console.</div>';
    });
}

init();
</script>
</body>
</html>
