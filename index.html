<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Prayer Times - جماعت کے اوقات</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --primary-green: #1B5E20;
            --dark-teal: #004D40;
            --light-cream: #FAF3E0;
            --text-dark: #1A1A1A;
            --text-light: #F5F5F5;
            --accent-red: #C62828;
            --shadow-soft: rgba(0, 0, 0, 0.1);
            --shadow-deep: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--dark-teal) 0%, var(--primary-green) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Islamic Pattern Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, var(--primary-gold) 35px, var(--primary-gold) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, var(--primary-gold) 35px, var(--primary-gold) 70px);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
        }

        /* Emergency Notification Bar */
        .notification-bar {
            background: linear-gradient(90deg, var(--accent-red), #D32F2F);
            color: var(--text-light);
            padding: 15px 20px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 4px 6px var(--shadow-soft);
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        .notification-bar.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(0, 77, 64, 0.95), rgba(27, 94, 32, 0.95));
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 4px 20px var(--shadow-deep);
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            text-shadow: 2px 2px 4px var(--shadow-deep);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header-subtitle {
            font-size: 1.5rem;
            color: var(--text-light);
            font-weight: 300;
            opacity: 0.9;
        }

        .current-time {
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--light-cream);
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Mosque Cards Grid */
        .mosques-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .mosque-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px var(--shadow-deep);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .mosque-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px var(--shadow-deep);
        }

        .mosque-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-gold), var(--primary-green));
        }

        .mosque-card::after {
            content: '☪';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            color: var(--primary-gold);
            opacity: 0.1;
        }

        .mosque-name {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--primary-green);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .prayer-times {
            display: grid;
            gap: 15px;
        }

        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: linear-gradient(90deg, rgba(27, 94, 32, 0.05), transparent);
            border-left: 4px solid var(--primary-gold);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .prayer-row:hover {
            background: linear-gradient(90deg, rgba(27, 94, 32, 0.1), transparent);
            transform: translateX(5px);
        }

        .prayer-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 1.1rem;
        }

        .prayer-time {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            color: var(--primary-green);
            font-weight: 700;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--light-cream);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-title {
                font-size: 2rem;
            }

            .header-subtitle {
                font-size: 1.2rem;
            }

            .mosques-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Emergency Notification Bar -->
        <div class="notification-bar" id="notificationBar"></div>

        <!-- Header -->
        <header class="header">
            <h1 class="header-title">مسجد جماعت کے اوقات</h1>
            <p class="header-subtitle">Mosque Prayer Times</p>
            <div class="current-time" id="currentTime"></div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="mosques-grid" id="mosquesGrid"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>May Allah accept our prayers • جزاک اللہ خیرا</p>
        </footer>
    </div>

    <script>
        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('mosqueAppData');
            if (saved) {
                return JSON.parse(saved);
            }
            // Default data if nothing in localStorage
            return {
                mosques: [
                    {
                        id: 1,
                        name: 'Central Masjid',
                        times: {
                            fajr: '05:30',
                            zuhr: '13:00',
                            asr: '16:30',
                            maghrib: '18:45',
                            isha: '20:15'
                        }
                    },
                    {
                        id: 2,
                        name: 'Al-Noor Masjid',
                        times: {
                            fajr: '05:35',
                            zuhr: '13:05',
                            asr: '16:35',
                            maghrib: '18:50',
                            isha: '20:20'
                        }
                    }
                ],
                notification: ''
            };
        }

        // Initialize app
        function init() {
            const appData = loadData();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            renderMosques(appData.mosques);
            renderNotification(appData.notification);
        }

        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('currentTime').textContent = now.toLocaleDateString('en-US', options);
        }

        // Render mosques on main page
        function renderMosques(mosques) {
            const grid = document.getElementById('mosquesGrid');
            grid.innerHTML = mosques.map(mosque => `
                <div class="mosque-card">
                    <h3 class="mosque-name">${mosque.name}</h3>
                    <div class="prayer-times">
                        <div class="prayer-row">
                            <span class="prayer-name">Fajr</span>
                            <span class="prayer-time">${mosque.times.fajr}</span>
                        </div>
                        <div class="prayer-row">
                            <span class="prayer-name">Zuhr</span>
                            <span class="prayer-time">${mosque.times.zuhr}</span>
                        </div>
                        <div class="prayer-row">
                            <span class="prayer-name">Asr</span>
                            <span class="prayer-time">${mosque.times.asr}</span>
                        </div>
                        <div class="prayer-row">
                            <span class="prayer-name">Maghrib</span>
                            <span class="prayer-time">${mosque.times.maghrib}</span>
                        </div>
                        <div class="prayer-row">
                            <span class="prayer-name">Isha</span>
                            <span class="prayer-time">${mosque.times.isha}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render notification bar
        function renderNotification(notification) {
            const bar = document.getElementById('notificationBar');
            if (notification) {
                bar.textContent = notification;
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        }

        // Listen for storage changes from other tabs (admin panel)
        window.addEventListener('storage', function(e) {
            if (e.key === 'mosqueAppData') {
                const appData = loadData();
                renderMosques(appData.mosques);
                renderNotification(appData.notification);
            }
        });

        // Auto-refresh every 30 seconds to catch localStorage updates
        setInterval(function() {
            const appData = loadData();
            renderMosques(appData.mosques);
            renderNotification(appData.notification);
        }, 30000);

        // Initialize on page load
        init();
    </script>
</body>
</html>
