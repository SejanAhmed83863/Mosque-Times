<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Admin Panel – Mosque Prayer Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --gold:#D4AF37; --green:#1B5E20; --teal:#004D40;
            --red:#C62828;  --shadow:rgba(0,0,0,0.25);
        }
        body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,var(--teal),var(--green));min-height:100vh;padding:30px 20px}

        .login-wrap{max-width:440px;margin:80px auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px var(--shadow)}
        .login-wrap h1{font-family:'Amiri',serif;font-size:2.4rem;color:var(--green);text-align:center;margin-bottom:6px}
        .login-wrap p{text-align:center;color:#777;margin-bottom:28px}
        .err{color:var(--red);font-size:.9rem;margin-top:6px;display:none}
        .err.on{display:block}

        .fg{margin-bottom:18px}
        .fg label{display:block;margin-bottom:7px;font-weight:600;color:#333}
        .fi{width:100%;padding:11px 14px;border:2px solid #ddd;border-radius:10px;font-size:1rem;font-family:'Tajawal',sans-serif;transition:.25s}
        .fi:focus{outline:none;border-color:var(--gold)}
        .btn-w{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border:none;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:6px;transition:.25s}
        .btn-w:hover{transform:translateY(-2px)}

        .panel{max-width:1100px;margin:0 auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px var(--shadow);display:none}
        .panel.on{display:block}

        .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);padding-bottom:18px;margin-bottom:28px;flex-wrap:wrap;gap:12px}
        .ph-left h1{font-family:'Amiri',serif;font-size:2.2rem;color:var(--green)}
        .ph-left span{font-size:.9rem;color:#777}
        .logout{padding:10px 22px;background:var(--red);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:.25s}
        .logout:hover{transform:scale(1.04)}

        .info-band{background:linear-gradient(90deg,rgba(212,175,55,.1),rgba(212,175,55,.03));border-left:5px solid var(--gold);border-radius:8px;padding:14px 18px;margin-bottom:26px;color:#555;font-size:.95rem}

        .toast{padding:14px 18px;background:#388E3C;color:#fff;border-radius:9px;margin-bottom:22px;display:none;animation:fadeIn .3s}
        .toast.on{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

        .mosque-item{background:#f5f5f5;border-left:5px solid var(--gold);border-radius:12px;padding:24px;margin-bottom:20px;transition:transform .25s,box-shadow .25s}
        .mosque-item:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
        .mi-name{font-family:'Amiri',serif;font-size:1.6rem;font-weight:700;color:var(--green);margin-bottom:5px}
        .mi-hint{font-size:.85rem;color:#888;margin-bottom:18px}

        .time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
        .tg{display:flex;flex-direction:column}
        .tg label{font-size:.85rem;font-weight:600;color:#666;margin-bottom:5px}
        .time-sel-wrap{display:flex;gap:5px;align-items:center}
        .time-sel{padding:8px 6px;border:2px solid #ddd;border-radius:7px;font-size:.95rem;cursor:pointer;background:#fff;transition:.2s;font-family:'Tajawal',sans-serif}
        .time-sel:focus{outline:none;border-color:var(--gold)}
        .ampm-sel{padding:8px 5px;border:2px solid #ddd;border-radius:7px;font-size:.9rem;cursor:pointer;background:#fff;transition:.2s}
        .ampm-sel:focus{outline:none;border-color:var(--gold)}

        .no-mosque{text-align:center;padding:60px 20px;color:#aaa}
        .no-mosque .icon{font-size:4rem;display:block;margin-bottom:16px}

        @media(max-width:600px){
            .time-grid{grid-template-columns:1fr 1fr}
            .ph{flex-direction:column;text-align:center}
        }
    </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
    <h1>Sub-Admin Panel</h1>
    <p>Update Prayer Times</p>
    <form onsubmit="doLogin(event)">
        <div class="fg"><label>Email</label><input class="fi" id="le" type="email" required></div>
        <div class="fg"><label>Password</label><input class="fi" id="lp" type="password" required></div>
        <div class="err" id="lerr">❌ Invalid email or password.</div>
        <button type="submit" class="btn-w">Login</button>
    </form>
</div>

<div class="panel" id="panel">
    <div class="ph">
        <div class="ph-left">
            <h1>🕌 Sub-Admin Dashboard</h1>
            <span id="userLabel"></span>
        </div>
        <button class="logout" onclick="doLogout()">Logout</button>
    </div>

    <div class="info-band">📝 Update jamaat prayer times for your assigned mosques. Changes appear on public display immediately.</div>

    <div class="toast" id="toast"></div>

    <div id="mosqueList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDa2rZvHFvQUVbxADMbm6Y3Luy0vTqOops",
  authDomain: "mosque-times-506dd.firebaseapp.com",
  projectId: "mosque-times-506dd",
  storageBucket: "mosque-times-506dd.firebasestorage.app",
  messagingSenderId: "851807138207",
  appId: "1:851807138207:web:1d2a103718debd15450daa",
  measurementId: "G-4MTXBD8NT5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PRAYERS = ['fajr','zuhr','asr','maghrib','isha'];
const PLABELS  = { fajr:'Fajr', zuhr:'Zuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };

let currentSA = null;

function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    setTimeout(()=> t.classList.remove('on'), 3000);
}

function to24(h, m, ap){
    let hour = parseInt(h);
    if(ap==='PM' && hour!==12) hour += 12;
    if(ap==='AM' && hour===12) hour = 0;
    return `${String(hour).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function doLogin(e){
    e.preventDefault();
    const email = document.getElementById('le').value;
    const pass  = document.getElementById('lp').value;
    
    // For now, create a simple sub-admin with all mosques
    // In real app, this would authenticate against Firestore
    if(email && pass){
        currentSA = { email: email, password: pass };
        document.getElementById('loginWrap').style.display='none';
        document.getElementById('panel').classList.add('on');
        document.getElementById('lerr').classList.remove('on');
        document.getElementById('userLabel').textContent = '👤 ' + email;
        renderMosques();
    } else {
        document.getElementById('lerr').classList.add('on');
    }
}

function doLogout(){
    currentSA = null;
    document.getElementById('loginWrap').style.display='';
    document.getElementById('panel').classList.remove('on');
    document.getElementById('le').value='';
    document.getElementById('lp').value='';
}

function renderMosques(){
    if(!currentSA) return;
    
    db.collection('mosques').orderBy('id').onSnapshot(snapshot => {
        const el = document.getElementById('mosqueList');
        if(snapshot.empty){
            el.innerHTML=`<div class="no-mosque"><span class="icon">🕌</span><h3>No Mosques Available</h3><p>Contact your administrator.</p></div>`;
            return;
        }

        let html = '';
        snapshot.forEach(m => {
            const data = m.data();
            html += `
                <div class="mosque-item">
                    <div class="mi-name">${data.name}</div>
                    <div class="mi-hint">Update jamaat prayer times below</div>
                    <div class="time-grid">
                        ${PRAYERS.map(p=> makeTimeSels(data.id, p, data.times[p])).join('')}
                    </div>
                </div>`;
        });
        el.innerHTML = html;
    }, error => {
        console.error('Error:', error);
        document.getElementById('mosqueList').innerHTML = '<p style="color:red">Error loading mosques</p>';
    });
}

function makeTimeSels(mosqueId, prayer, val24){
    const [hh, mm] = val24 ? val24.split(':') : ['05','00'];
    let h = parseInt(hh); const ap = h>=12?'PM':'AM'; h = h%12||12;
    const hOpts  = Array.from({length:12},(_,i)=>i+1).map(n=>`<option ${n===h?'selected':''}>${n}</option>`).join('');
    const mOpts  = Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(n=>`<option ${n===String(parseInt(mm)).padStart(2,'0')?'selected':''}>${n}</option>`).join('');
    const apOpts = ['AM','PM'].map(x=>`<option ${x===ap?'selected':''}>${x}</option>`).join('');
    const pid = `${mosqueId}_${prayer}`;
    return `<div class="tg">
        <label>${PLABELS[prayer]}</label>
        <div class="time-sel-wrap">
            <select class="time-sel" id="H_${pid}"  onchange="saveTime(${mosqueId},'${prayer}')">${hOpts}</select>
            :
            <select class="time-sel" id="M_${pid}"  onchange="saveTime(${mosqueId},'${prayer}')">${mOpts}</select>
            <select class="ampm-sel" id="AP_${pid}" onchange="saveTime(${mosqueId},'${prayer}')">${apOpts}</select>
        </div>
    </div>`;
}

function saveTime(mosqueId, prayer){
    const pid = `${mosqueId}_${prayer}`;
    const h  = document.getElementById(`H_${pid}`).value;
    const m  = document.getElementById(`M_${pid}`).value;
    const ap = document.getElementById(`AP_${pid}`).value;
    
    db.collection('mosques').doc(String(mosqueId)).update({
        [`times.${prayer}`]: to24(h,m,ap)
    }).then(() => {
        showToast(`✅ ${PLABELS[prayer]} time updated!`);
    }).catch(e => {
        console.error('Error:', e);
        showToast('❌ Error updating time');
    });
}

setInterval(()=>{ if(currentSA) renderMosques(); }, 10000);
window.addEventListener('storage', e=>{ if(currentSA) renderMosques(); });
</script>
</body>
</html>
